<div class="job-container">
  <mat-toolbar color="primary">
    <span>Copy Jobs</span>
    <span class="spacer"></span>
    <button mat-raised-button class="add-job-button" (click)="addJob()">
      <mat-icon>add</mat-icon>
      <span>Create Job</span>
    </button>
  </mat-toolbar>

  <mat-card class="job-card">
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <!-- Source User -->
        <ng-container matColumnDef="sourceUser">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Source User</th>
          <td mat-cell *matCellDef="let job">{{ job.source_user_name }}</td>
        </ng-container>

        <!-- Target User -->
        <ng-container matColumnDef="targetUser">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Target User</th>
          <td mat-cell *matCellDef="let job">{{ job.target_user_name }}</td>
        </ng-container>

        <!-- From Date -->
        <ng-container matColumnDef="fromDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>From Date</th>
          <td mat-cell *matCellDef="let job">{{ job.from_date }}</td>
        </ng-container>

        <!-- To Date -->
        <ng-container matColumnDef="toDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>To Date</th>
          <td mat-cell *matCellDef="let job">{{ job.to_date }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let job">{{ getStatusLabel(job.status) }}</td>
        </ng-container>

        <!-- Stage -->
        <ng-container matColumnDef="stage">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stage</th>
          <td mat-cell *matCellDef="let job">{{ getStageLabel(job.current_stage) }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let job">
            <button mat-icon-button class="retry-button" (click)="retryJob(job.id)" *ngIf="job.status === 3">
              <mat-icon>refresh</mat-icon>
            </button>
            <button mat-raised-button class="run-ledger-button"
              *ngIf="job.current_stage === 7 && job.status === 2"
              (click)="onTriggerLedger(job.id)">
              <mat-icon>play_arrow</mat-icon>
              <span>Run Ledger Job</span>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
