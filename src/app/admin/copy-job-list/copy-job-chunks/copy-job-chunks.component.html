<div class="job-container">
  <mat-toolbar color="primary">
    <span>Chunks for Table {{ tableId }}</span>
    <span class="spacer"></span>
    <button mat-raised-button class="back-button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      <span>Back</span>
    </button>
  </mat-toolbar>
  <mat-card class="job-card">
    <mat-card-content>
      <table mat-table [dataSource]="chunks" class="mat-elevation-z8">

        <!-- Chunk Index -->
        <ng-container matColumnDef="chunkIndex">
          <th mat-header-cell *matHeaderCellDef>Chunk</th>
          <td mat-cell *matCellDef="let c">{{ c.chunk_index }}</td>
        </ng-container>

        <!-- S3 Key -->
        <ng-container matColumnDef="s3Key">
          <th mat-header-cell *matHeaderCellDef>S3 Key</th>
          <td mat-cell *matCellDef="let c">{{ c.s3_key }}</td>
        </ng-container>

        <!-- Counts -->
        <ng-container matColumnDef="counts">
          <th mat-header-cell *matHeaderCellDef>Counts</th>
          <td mat-cell *matCellDef="let c">
            Rows: {{c.row_count}} |
            Processed: {{c.processed_count}}
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let c">{{ getStatusLabel(c.status) }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['chunkIndex','s3Key','counts','status']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['chunkIndex','s3Key','counts','status']"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
