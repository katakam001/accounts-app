<div class="exports-container">
  <mat-toolbar color="primary">
    <span>Export History</span>
    <span class="spacer"></span>
  </mat-toolbar>

  <mat-card class="exports-card">
    <mat-card-content>
      <div class="filter-container">
        <mat-form-field appearance="fill" class="custom-date-picker">
          <mat-label>From Date</mat-label>
          <input matInput [matDatepicker]="fromDatePicker" [formControl]="fromDate">
          <mat-datepicker-toggle matSuffix [for]="fromDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #fromDatePicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill" class="custom-date-picker">
          <mat-label>To Date</mat-label>
          <input matInput [matDatepicker]="toDatePicker" [formControl]="toDate">
          <mat-datepicker-toggle matSuffix [for]="toDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #toDatePicker></mat-datepicker>
        </mat-form-field>
        <span class="spacer"></span>

        <button mat-raised-button color="primary" class="generate-report-button" (click)="loadExports()">
          Get Download History
        </button>
      </div>
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <!-- File Name -->
        <ng-container matColumnDef="file_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>File Name</th>
          <td mat-cell *matCellDef="let export"> {{ export.file_name }} </td>
        </ng-container>

        <!-- File Type -->
        <ng-container matColumnDef="file_type">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
          <td mat-cell *matCellDef="let export"> {{ export.file_type }} </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let export"> {{ getStatusLabel(export.status) }} </td>
        </ng-container>

        <!-- Pushed At (output_key_timestamp) -->
        <ng-container matColumnDef="output_key_timestamp">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Pushed At</th>
          <td mat-cell *matCellDef="let export">
            {{ export.output_key_timestamp ? (export.output_key_timestamp | date:'dd-MM-yyyy, h:mm:ss a') : '—' }}
          </td>
        </ng-container>

        <!-- Download Action -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Download</th>
          <td mat-cell *matCellDef="let export">
            <button mat-icon-button class="download-button" [disabled]="export.status !== 2"
              (click)="downloadExport(export)">
              <mat-icon>download</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
