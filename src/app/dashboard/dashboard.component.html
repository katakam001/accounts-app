<!-- Back to Admin Button (only if impersonated) -->
<div *ngIf="isImpersonated" class="back-to-admin-container">
  <button mat-raised-button class="back-to-admin-button" (click)="backToAdmin()">
    <mat-icon>arrow_back</mat-icon>
    Back to Admin
  </button>
</div>

<!-- Set Financial Year -->
<button mat-button class="set-financial-year-button" (click)="openFinancialYearDialog()">Set Financial Year</button>

<!-- Financial Year Display -->
<div *ngIf="financialYear" class="financial-year-container">
  <p class="financial-year-text">Current Financial Year: {{ financialYear }}</p>
  <p class="financial-year-status">Status: {{ financialYearStatus }}</p>
  <p *ngIf="financialYearError" class="financial-year-error">Error: {{ financialYearError }}</p>

  <!-- Retry button if failed -->
  <button *ngIf="financialYearStatus === 'Failed'" mat-button (click)="openFinancialYearDialog()">
    Retry Financial Year
  </button>
</div>

<!-- Dashboard Chart -->
<div class="dashboard-container" *ngIf="financialYearStatus === 'Ready'">
  <div class="dashboard-section">
    <h3>Entry Type Summary</h3>
    <canvas
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType"
    ></canvas>
  </div>
</div>
