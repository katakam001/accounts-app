<h1 mat-dialog-title>Enter Financial Year</h1>
<div mat-dialog-content>
  <mat-form-field>
    <mat-label>Select Date</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="dateControl">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <!-- Show status and error after save -->
  <div *ngIf="financialYearStatus" class="financial-year-status">
    <p>Status: {{ financialYearStatus }}</p>
    <p *ngIf="financialYearError" class="financial-year-error">
      Error: {{ financialYearError }}
    </p>
  </div>
</div>

<div mat-dialog-actions class="dialog-actions">
  <button mat-button class="cancel-button" (click)="dialogRef.close()">Cancel</button>
  <button mat-button class="save-button" (click)="onSave()">Save</button>
</div>

<!-- Retry button if failed -->
<div *ngIf="financialYearStatus === 'Failed'" class="retry-container">
  <button mat-raised-button color="warn" (click)="onSave()">Retry</button>
</div>
