<div class="fields-container">
  <mat-toolbar color="primary">
    <span>Fields</span>
    <span class="spacer"></span>
    <button mat-raised-button class="add-field-button" (click)="addField()">
      <mat-icon>add</mat-icon>Add New Field
    </button>
  </mat-toolbar>

  <mat-card class="fields-card">
    <mat-card-content>
            <div class="filter-container">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search Fields</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Search by field name">
          <button mat-icon-button matSuffix>
            <mat-icon color="primary">search</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <div *ngIf="financialYear" class="financial-year-container">
        <p class="financial-year-text">Current Financial Year: {{ financialYear }}</p>
      </div>
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
        <ng-container matColumnDef="field_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Field Name </th>
          <td mat-cell *matCellDef="let field"> {{ field.field_name }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let field">
            <button mat-icon-button color="primary" class="edit-button" (click)="editField(field)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" class="delete-button" (click)="deleteField(field.id,field.field_name)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
